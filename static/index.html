<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ULTRATHINK - Agent Feed</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>ULTRATHINK</h1>
            <div class="controls">
                <button id="pauseBtn" class="control-btn">Pause</button>
                <select id="filterSelect" class="filter-select">
                    <option value="all">All Events</option>
                    <option value="commit">Commits</option>
                    <option value="todo">TODO</option>
                </select>
            </div>
        </header>

        <div class="objective-section">
            <h2>Current Objective</h2>
            <div id="currentObjective" class="objective">Loading...</div>
        </div>

        <div class="feed-section">
            <h2>Agent Feed</h2>
            <div id="feedList" class="feed-list">
                <div class="no-events">No events yet...</div>
            </div>
        </div>

        <div class="status-bar">
            <span id="status">Connected</span>
            <span id="eventCount">0 events</span>
        </div>
    </div>

    <!-- TODO.md Sidebar -->
    <div id="todoSidebar" class="sidebar">
        <div class="sidebar-header">
            <h3>TODO.md</h3>
            <button id="closeSidebar" class="close-btn">&times;</button>
        </div>
        <div class="sidebar-content">
            <pre id="todoContent">Loading...</pre>
        </div>
    </div>

    <!-- File List Modal -->
    <div id="fileListModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h4>Modified Files</h4>
                <button id="closeModal" class="close-btn">&times;</button>
            </div>
            <div id="fileList" class="file-list"></div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
